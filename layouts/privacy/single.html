{{ define "main" }}
<div class="container">
  <article class="privacy-content">
    {{ .Content }}
  </article>
</div>

<style>
  .privacy-content {
    max-width: 760px;
    margin: 32px auto 64px;
    padding: 0 16px;
    line-height: 1.75;
    color: #1a1a1a;
    font-size: 15px;
  }
  .privacy-content h1 {
    font-size: 28px;
    margin: 8px 0 4px;
  }
  .privacy-content h2 {
    font-size: 20px;
    margin: 36px 0 12px;
    color: #007722;
    border-left: 4px solid #007722;
    padding-left: 10px;
  }
  .privacy-content p { margin: 12px 0; }
  .privacy-content ul { padding-left: 22px; }
  .privacy-content li { margin: 8px 0; }
  .privacy-content blockquote {
    margin: 20px 0;
    padding: 14px 18px;
    background: #f6f9f6;
    border: 1px solid #e2ece2;
    border-radius: 8px;
    color: #333;
  }
  .privacy-content code {
    background: #f0f0f0;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: #b5351f;
  }
  .privacy-content a { color: #007722; }
</style>
{{ end }}
